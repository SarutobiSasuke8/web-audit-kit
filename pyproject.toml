[project]
name = "web-audit-kit"
version = "0.1.0"
description = "Small reusable SEO/AEO checks: JSON-LD validator, llms.txt linter, meta length checker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
web-audit-kit = "web_audit_kit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["web_audit_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
